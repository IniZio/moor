# The tests mostly wait on child processes and timers, not the CPU, so run more than one per core.
[profile.default]
test-threads = 16

[profile.timing.junit]
path = "junit.xml"

[[profile.default.overrides]]
filter = 'test(/run_output_reaches_the_client|a_drain_lets_a_run_in_flight/)'
success-output = "immediate"
