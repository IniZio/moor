[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]

[advisories]
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0374", reason = "basic-toml is unmaintained; only age's i18n-embed-fl proc-macro reads its own i18n.toml with it at build time" },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 comes only through elliptic-curve 0.13 (p256) in age 0.12 and nono-proxy's aws-config, with no release on 0.7; moor seals with age x25519 and never runs P-256, and the Proxy has no aws_auth route" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "Zlib",
  "BSD-3-Clause",
]
confidence-threshold = 0.93

[[licenses.exceptions]]
allow = ["ISC"]
crate = "ring"

[[licenses.exceptions]]
allow = ["ISC"]
crate = "rustls-webpki"

[[licenses.exceptions]]
allow = ["ISC"]
crate = "untrusted"

# aws-lc-rs is ISC; pulled by nono-proxy's aws stack
[[licenses.exceptions]]
allow = ["ISC"]
crate = "aws-lc-rs"

# aws-lc-sys is ISC and MIT-0; pulled by nono-proxy's aws stack
[[licenses.exceptions]]
allow = ["ISC", "MIT-0"]
crate = "aws-lc-sys"

# webpki-roots ships Mozilla root data under CDLA-Permissive-2.0; pulled by hyper-rustls
[[licenses.exceptions]]
allow = ["CDLA-Permissive-2.0"]
crate = "webpki-roots"

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
  { crate = "signal-hook@0.3.18", reason = "crossterm, under ratatui in moor-herdr, is still on 0.3; moor uses 0.4" },
]
skip-tree = [
  { crate = "nono-proxy@0.80.0", reason = "nono-proxy's aws and sigstore stack duplicates many crates; versions are not ours to align" },
  { crate = "rmcp@3.7.0", reason = "rmcp needs rand 0.10 while age and tungstenite stay on 0.8 and 0.9; versions are not ours to align" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/IniZio/nono"]
