[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]

[advisories]
yanked = "deny"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "Zlib",
  "BSD-3-Clause",
]
confidence-threshold = 0.93

[[licenses.exceptions]]
allow = ["ISC"]
crate = "ring"

[[licenses.exceptions]]
allow = ["ISC"]
crate = "rustls-webpki"

[[licenses.exceptions]]
allow = ["ISC"]
crate = "untrusted"

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
  { crate = "getrandom@0.2.17", reason = "ring needs getrandom 0.2; moor pins 0.4" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
