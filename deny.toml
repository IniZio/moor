[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]

[advisories]
yanked = "deny"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "Zlib",
  "BSD-3-Clause",
]
confidence-threshold = 0.93

[[licenses.exceptions]]
allow = ["ISC"]
crate = "ring"

[[licenses.exceptions]]
allow = ["ISC"]
crate = "rustls-webpki"

[[licenses.exceptions]]
allow = ["ISC"]
crate = "untrusted"

# aws-lc-rs is ISC; pulled by nono-proxy's aws stack
[[licenses.exceptions]]
allow = ["ISC"]
crate = "aws-lc-rs"

# aws-lc-sys is ISC and MIT-0; pulled by nono-proxy's aws stack
[[licenses.exceptions]]
allow = ["ISC", "MIT-0"]
crate = "aws-lc-sys"

# webpki-roots ships Mozilla root data under CDLA-Permissive-2.0; pulled by hyper-rustls
[[licenses.exceptions]]
allow = ["CDLA-Permissive-2.0"]
crate = "webpki-roots"

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = []
skip-tree = [
  { crate = "nono-proxy@0.80.0", reason = "nono-proxy's aws and sigstore stack duplicates many crates; versions are not ours to align" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
