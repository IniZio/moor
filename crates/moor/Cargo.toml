[package]
name = "moor"
version = "0.2.0"
edition = "2021"
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "moor"
path = "src/main.rs"

[features]
pty-surface = ["dep:ghostty-vt"]

[dependencies]
ghostty-vt = { version = "=0.8.0", default-features = false, optional = true }
moor-core = { path = "../moor-core" }
moor-client = { path = "../moor-client" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.40", features = ["bundled"] }
moor-migrate = { path = "../moor-migrate" }
thiserror = "2"
webpki-roots = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
rustix = { version = "1", features = [
  "event",
  "fs",
  "mount",
  "net",
  "process",
  "stdio",
  "thread",
] }
zeroize = "1"
oauth2 = { version = "5", default-features = false }
age = { version = "0.12", default-features = false }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
signal-hook = "=0.4.4"
getrandom = "=0.4.3"
command-fds = "0.3"
ureq = { version = "3", default-features = false, features = [
  "rustls-no-provider",
  "platform-verifier",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
nono-proxy = { version = "=0.80.0", default-features = false }
nono = { version = "=0.80.0", default-features = false }
nix = { version = "0.31", default-features = false, features = [
  "net",
  "sched",
  "socket",
] }
tokio = { version = "1", default-features = false, features = [
  "rt-multi-thread",
] }
portable-pty = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31", default-features = false, features = [
  "sched",
  "socket",
  "user",
] }

[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-core = "0.9.0"
netlink-packet-route = "0.33"
netlink-sys = "0.9.0"

[dev-dependencies]
tempfile = "3"
toml = "0.5"
moor-testkit = { path = "../moor-testkit" }
rcgen = { version = "0.14", default-features = false, features = [
  "pem",
  "ring",
] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
indexing_slicing = "deny"
missing_docs_in_private_items = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
string_slice = "deny"
missing_errors_doc = "allow"
allow_attributes_without_reason = "deny"
cognitive_complexity = "deny"
redundant_pub_crate = "allow"
