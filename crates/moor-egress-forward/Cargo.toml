[package]
name = "moor-egress-forward"
version = "0.2.0"
edition = "2021"
publish = false
description = "Runs in a Box: carries each CONNECT tinyproxy sends it to the shared egress Proxy over a WebSocket."

[lib]
name = "moor_egress_forward"
path = "src/lib.rs"

[[bin]]
name = "moor-egress-forward"
path = "src/main.rs"

[dependencies]
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = [
  "sink",
  "std",
] }
httparse = "1"
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = [
  "rt",
  "net",
  "io-util",
  "time",
  "macros",
] }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
  "connect",
  "handshake",
  "__rustls-tls",
] }
webpki-roots = "1"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = [
  "pem",
  "ring",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
] }
tempfile = "3"
tokio = { version = "1", default-features = false, features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "time",
  "macros",
  "sync",
] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
indexing_slicing = "deny"
missing_docs_in_private_items = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
string_slice = "deny"
missing_errors_doc = "allow"
allow_attributes_without_reason = "deny"
cognitive_complexity = "deny"
redundant_pub_crate = "allow"
