claude:
  hosts: [api.anthropic.com]
  credential: CLAUDE_CODE_OAUTH_TOKEN
  inject:
    header: Authorization
    form: "Bearer {secret}"
  box_env:
    CLAUDE_CODE_OAUTH_TOKEN: moor-proxy
    CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
github-api:
  hosts: [api.github.com]
  credential: forge
  inject:
    header: Authorization
    form: "token {secret}"
  allow:
    - "GET /repos/{repo}"
    - "GET|POST /repos/{repo}/pulls"
    - "GET|PATCH /repos/{repo}/pulls/*"
    - "GET /repos/{repo}/pulls/*/files"
    - "GET /repos/{repo}/pulls/*/commits"
    - "GET /repos/{repo}/pulls/*/comments"
    - "GET|POST /repos/{repo}/pulls/*/reviews"
    - "POST|DELETE /repos/{repo}/pulls/*/requested_reviewers"
    - "PUT /repos/{repo}/pulls/*/update-branch"
    - "GET|POST /repos/{repo}/issues/*/comments"
    - "GET /repos/{repo}/commits/*/check-runs"
    - "GET /repos/{repo}/commits/*/status"
    - "GET /repos/{repo}/actions/**"
    - "GET /repos/{repo}/check-runs/*/annotations"
    - "GET /rate_limit"
    - "GET|POST /repos/{repo}/stacks"
    - "GET /repos/{repo}/stacks/*"
    - "POST /repos/{repo}/stacks/*/add"
    - "POST /repos/{repo}/stacks/*/unstack"
    - "POST /graphql"
  box_env:
    GH_TOKEN: moor-proxy
    GH_REPO: "{repo}"
    GH_NO_UPDATE_NOTIFIER: "1"
    GH_TELEMETRY: disabled
github-git:
  hosts: [github.com]
  credential: forge
  inject:
    basic_user: x-access-token
  allow:
    - "GET /{repo}.git/info/refs"
    - "POST /{repo}.git/git-upload-pack"
    - "POST /{repo}.git/git-receive-pack"
