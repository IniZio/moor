[package]
name = "moor-core"
version = "0.2.0"
edition = "2021"
publish = false

[dependencies]
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3.0"
serde_json = "1"
serde_path_to_error = "0.1.20"
sha2 = "0.10"
thiserror = "2"
url = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
moor-testkit = { path = "../moor-testkit" }
rustix = { version = "1", features = ["process"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
indexing_slicing = "deny"
missing_docs_in_private_items = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
string_slice = "deny"
missing_errors_doc = "deny"
allow_attributes_without_reason = "deny"
cognitive_complexity = "deny"
redundant_pub_crate = "allow"
