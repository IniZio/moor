[package]
name = "moor-machine-agent"
version = "0.2.0"
edition = "2021"
publish = false
description = "Runs on a person's own computer so Boxes can claim it: enrolls it with their sign-in."

[lib]
name = "moor_machine_agent"
path = "src/lib.rs"

[[bin]]
name = "moor-machine-agent"
path = "src/main.rs"

[dependencies]
moor-client = { path = "../moor-client", features = ["link"] }
moor-core = { path = "../moor-core" }
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
self-replace = "1"
semver = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh-key = { version = "0.6", default-features = false, features = [
  "std",
  "ed25519",
  "rand_core",
  "getrandom",
] }
tokio = { version = "1", features = [
  "rt",
  "fs",
  "time",
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "sync",
] }

[dev-dependencies]
moor-machine-runner = { path = "../moor-machine-runner" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
moor-core = { path = "../moor-core" }
moor-gate = { path = "../moor-gate" }
moor-testkit = { path = "../moor-testkit" }
rusqlite = { version = "0.40", features = ["bundled"] }
ureq = { version = "3", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
indexing_slicing = "deny"
missing_docs_in_private_items = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
string_slice = "deny"
missing_errors_doc = "allow"
allow_attributes_without_reason = "deny"
cognitive_complexity = "deny"
redundant_pub_crate = "allow"
