[package]
name = "moor-hc"
version = "0.2.0"
edition = "2021"
publish = false
description = "An hc front for moor: one hc machine per open Box, reached through the Box's own hc."

[lib]
name = "moor_hc"
path = "src/lib.rs"

[[bin]]
name = "moor-hc"
path = "src/main.rs"

[dependencies]
moor-client = { path = "../moor-client" }
moor-core = { path = "../moor-core" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
signal-hook = "=0.4.4"

[dev-dependencies]
moor-testkit = { path = "../moor-testkit" }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
indexing_slicing = "deny"
missing_docs_in_private_items = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
string_slice = "deny"
missing_errors_doc = "allow"
allow_attributes_without_reason = "deny"
cognitive_complexity = "deny"
redundant_pub_crate = "allow"
