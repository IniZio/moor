[package]
name = "moor-schema"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
moor-migrate = { path = "../moor-migrate" }
sea-query = { version = "1.0.2", default-features = false, features = [
  "derive",
] }

[dev-dependencies]
postgres = "0.19.14"
rusqlite = { version = "0.40", features = ["bundled"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
indexing_slicing = "deny"
missing_docs_in_private_items = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
string_slice = "deny"
missing_errors_doc = "allow"
allow_attributes_without_reason = "deny"
cognitive_complexity = "deny"
redundant_pub_crate = "allow"
