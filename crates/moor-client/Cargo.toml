[package]
name = "moor-client"
version = "0.2.0"
edition = "2021"
publish = false

[dependencies]
moor-core = { path = "../moor-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oauth2 = { version = "5", default-features = false }
ureq = { version = "3", default-features = false, features = [
  "rustls-no-provider",
  "platform-verifier",
] }
webpki-roots = "1"
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
tungstenite = { version = "0.29", default-features = false, features = [
  "handshake",
] }

futures-util = { version = "0.3", optional = true, default-features = false, features = [
  "sink",
] }
tokio = { version = "1", optional = true, features = [
  "rt",
  "net",
  "io-util",
  "time",
  "macros",
] }
tokio-tungstenite = { version = "0.29", optional = true, default-features = false, features = [
  "connect",
  "handshake",
  "__rustls-tls",
] }
tokio-util = { version = "0.7", optional = true, features = ["compat"] }
yamux = { version = "0.13", optional = true }

[features]
link = ["dep:futures-util", "dep:tokio", "dep:tokio-tungstenite", "dep:tokio-util", "dep:yamux"]

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
indexing_slicing = "deny"
missing_docs_in_private_items = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
string_slice = "deny"
missing_errors_doc = "allow"
allow_attributes_without_reason = "deny"
cognitive_complexity = "deny"
redundant_pub_crate = "allow"
