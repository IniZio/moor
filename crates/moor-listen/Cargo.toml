[package]
name = "moor-listen"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
moor-client = { path = "../moor-client" }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = [
  "rustls-no-provider",
  "platform-verifier",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }

[dev-dependencies]
moor-core = { path = "../moor-core" }
moor-gate = { path = "../moor-gate" }
moor-testkit = { path = "../moor-testkit" }
jsonwebtoken = { version = "9", default-features = false }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
indexing_slicing = "deny"
missing_docs_in_private_items = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
string_slice = "deny"
missing_errors_doc = "allow"
allow_attributes_without_reason = "deny"
cognitive_complexity = "deny"
redundant_pub_crate = "allow"
