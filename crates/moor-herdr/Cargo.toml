[package]
name = "moor-herdr"
version = "0.2.0"
edition = "2021"
publish = false
description = "A herdr front for moor: each open Box is a herdr workspace with the agent's terminal in it."

[lib]
name = "moor_herdr"
path = "src/lib.rs"

[[bin]]
name = "moor-herdr"
path = "src/main.rs"

[dependencies]
moor-client = { path = "../moor-client" }
moor-core = { path = "../moor-core" }
clap = { version = "4", features = ["derive", "env"] }
rustix = { version = "1", features = ["termios", "stdio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "=0.4.4"
thiserror = "2"
ratatui = "=0.30.2"
oauth2 = { version = "5", default-features = false }

[dev-dependencies]
ureq = { version = "3", default-features = false }
tempfile = "3"
sha2 = "0.10"
base64 = "0.22"
tungstenite = { version = "0.29", default-features = false, features = [
  "handshake",
] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
indexing_slicing = "deny"
missing_docs_in_private_items = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
string_slice = "deny"
missing_errors_doc = "allow"
allow_attributes_without_reason = "deny"
cognitive_complexity = "deny"
redundant_pub_crate = "allow"
