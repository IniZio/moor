box:
  size: medium
cache:
  volumes:
    - name: cargo-bin
      path: ~/.cargo/bin
setup:
  - '[ ! -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] || if [ "$(id -u)" = 0 ]; then sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0; else sudo -n sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0; fi'
  - 'command -v cc >/dev/null || if [ "$(id -u)" = 0 ]; then apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential; else sudo -n apt-get update -qq && sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential; fi'
  - '[ -x "$HOME/.cargo/bin/rustup" ] || curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none --profile minimal'
  - 'for b in cargo rustc rustup rustfmt cargo-fmt cargo-clippy clippy-driver cargo-deny cargo-machete cargo-nextest taplo typos; do if [ "$(id -u)" = 0 ]; then ln -sf "$HOME/.cargo/bin/$b" "/usr/local/bin/$b"; else sudo -n ln -sf "$HOME/.cargo/bin/$b" "/usr/local/bin/$b"; fi; done'
  - rustup toolchain install
  - make setup
