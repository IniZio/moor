# Local Postgres for the store schema test: `make dev-db` starts it and `make unit-pg` runs the
# test against it. Put local changes, such as another host port, in docker-compose.override.yaml.
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: moor
      POSTGRES_PASSWORD: moor
      POSTGRES_DB: moor
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "moor"]
      interval: 1s
      timeout: 5s
      retries: 30
