# A tool the image lacks: the agent installs it, gives the setup line, and leaves the repo alone.
keys = ["setup"]
mode = "task"
prompt = "Lint the shell scripts under scripts/ with shellcheck and tell me what it finds. Report only; leave the scripts as they are."
probes = { shellcheck = "command -v shellcheck" }

[[assert]]
says = "shellcheck installed"
from = "probes"
where = { name = "^shellcheck$", exit = "^0$" }

[[assert]]
says = "a setup line in the final message"
from = "final"
where = { text = "(?i)(apt-get|apt|apk|dnf|yum|pip3?|pipx|brew|cargo|curl|wget|tar)[^\\n]*shellcheck" }

[[assert]]
says = "no repo file changed for it"
from = "changes"
where = { path = "(^|/)(\\.moor\\.yaml|moor-repo-config\\.yaml|moor-setup\\.sh|Dockerfile|\\.devcontainer|\\.github/)" }
min = 0
max = 0
