[workspace]
members = [
  "crates/moor",
  "crates/moor-client",
  "crates/moor-core",
  "crates/moor-slack",
  "crates/moor-testkit",
  "crates/moor-web",
  "tools/layering",
  "tools/e2e-budget",
]
exclude = ["target"]
resolver = "2"

[patch.crates-io]
nono = { git = "https://github.com/IniZio/nono", rev = "0057e5c045571d686bd3231154ebe67bc0861fec" }
nono-proxy = { git = "https://github.com/IniZio/nono", rev = "0057e5c045571d686bd3231154ebe67bc0861fec" }

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
