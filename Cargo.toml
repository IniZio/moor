[workspace]
members = [
  "crates/moor",
  "crates/moor-core",
  "crates/moor-web",
  "tools/layering",
  "tools/e2e-budget",
]
exclude = ["target"]
resolver = "2"

[patch.crates-io]
nono = { git = "https://github.com/IniZio/nono", rev = "d3c7bdff4c8e50b6595f036446ffd6bfe38a8d5d" }
nono-proxy = { git = "https://github.com/IniZio/nono", rev = "d3c7bdff4c8e50b6595f036446ffd6bfe38a8d5d" }

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
