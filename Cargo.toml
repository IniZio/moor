[workspace]
members = [
  "crates/moor",
  "crates/moor-client",
  "crates/moor-core",
  "crates/moor-egress-forward",
  "crates/moor-gate",
  "crates/moor-herdr",
  "crates/moor-listen",
  "crates/moor-machine-agent",
  "crates/moor-machine-runner",
  "crates/moor-migrate",
  "crates/moor-notify",
  "crates/moor-schema",
  "crates/moor-slack",
  "crates/moor-testkit",
  "crates/moor-web",
  "tools/layering",
  "tools/test-children",
  "tools/migration-numbers",
  "tools/store-sql",
  "tools/e2e-budget",
]
exclude = ["target"]
resolver = "2"

[patch.crates-io]
nono = { git = "https://github.com/IniZio/nono", rev = "83e639c4ae59538c33753c287324e5a80114a301" }
nono-proxy = { git = "https://github.com/IniZio/nono", rev = "83e639c4ae59538c33753c287324e5a80114a301" }

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
