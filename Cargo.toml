[workspace]
members = [
  "crates/moor",
  "crates/moor-client",
  "crates/moor-core",
  "crates/moor-slack",
  "crates/moor-testkit",
  "crates/moor-web",
  "tools/layering",
  "tools/e2e-budget",
]
exclude = ["target"]
resolver = "2"

[patch.crates-io]
nono = { git = "https://github.com/IniZio/nono", rev = "46c79a0d67dc084645e856c3a40b43791edc91c8" }
nono-proxy = { git = "https://github.com/IniZio/nono", rev = "46c79a0d67dc084645e856c3a40b43791edc91c8" }

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
