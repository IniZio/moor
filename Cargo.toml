[workspace]
members = [
  "crates/moor",
  "crates/moor-client",
  "crates/moor-core",
  "crates/moor-slack",
  "crates/moor-testkit",
  "crates/moor-web",
  "tools/layering",
  "tools/e2e-budget",
]
exclude = ["target"]
resolver = "2"

[patch.crates-io]
nono = { git = "https://github.com/IniZio/nono", rev = "83e639c4ae59538c33753c287324e5a80114a301" }
nono-proxy = { git = "https://github.com/IniZio/nono", rev = "83e639c4ae59538c33753c287324e5a80114a301" }

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
