[workspace]
members = [
  "crates/moor",
  "crates/moor-core",
  "crates/moor-web",
  "tools/layering",
  "tools/e2e-budget",
]
exclude = ["target"]
resolver = "2"

[patch.crates-io]
nono = { git = "https://github.com/IniZio/nono", rev = "00bb850a07b03935111ca1fb64798e6648c5a7ef" }
nono-proxy = { git = "https://github.com/IniZio/nono", rev = "00bb850a07b03935111ca1fb64798e6648c5a7ef" }

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
