image:
  repository: ghcr.io/inizio/moor
  # Empty uses the chart's appVersion, the release that published it.
  tag: ""
  pullPolicy: IfNotPresent

# Public values every install fills by hand; docs/kubernetes.md lists where each comes from.
host: ""
authgear:
  issuer: ""
  clientId: ""
mcp:
  resourceUrl: ""

# Secret values: keep them out of plain values files.
vault:
  key: ""
crabbox:
  agent37Token: ""
  # The crabbox config, as a map or as the file text. The provider reads its key from /var/lib/moor/config/agent37.key (keyFile).
  config: null
  # ssh private key whose public half the provider account trusts; crabbox reads it at /var/lib/moor/config/box-ssh-key.
  sshKey: ""

# The controller store. Empty url keeps the SQLite file on the state volume. A set url (a secret, kept out of
# plain values files) moves the store to Postgres and starts it empty: an init container moves an existing
# SQLite state dir's contents into state/.sqlite-<time> (kept, never read again).
database:
  url: ""
  # Read connections the controller keeps open (MOOR_DATABASE_READERS).
  readers: 4

# Where artifacts, reports and transcripts live (docs/config.md). Empty keeps them in the state
# directory. Not rendered yet. A bucket takes these keys, the last two from the SOPS file:
#   s3:
#     endpoint: ""
#     bucket: ""
#     accessKey: ""
#     secretKey: ""
blobs: {}

controller:
  uid: 10001
  # surface.kind in the controller config. Empty keeps the image default, MOOR_SURFACE=pty; a set value overrides it.
  surface: ""
  # agent.model in the controller config: the model a Box's agent starts with. Empty leaves the agent's own default.
  agentModel: ""
  # Shared nodes as {name: {runtime, labels, max_boxes}}; empty runs Boxes only on enrolled machines.
  nodes: {}
  # box.node: the default shared node; needed only when nodes has more than one entry.
  defaultNode: ""
  # Per-provider settings, e.g. `external: {strip_env: [X]}`.
  drivers: {}
  settleEverySecs: 5
  # Kept short while one pod runs everything: the pod is replaced, not rolled.
  drainTimeoutSecs: 30
  resources: {}
  # Extra env for the controller container, as a list of {name, value}.
  extraEnv: []

slack:
  enabled: false
  appToken: ""
  botToken: ""
  resources: {}

# moor-notify: delivers the webhooks users add with the gate's add_webhook tool.
notify:
  enabled: false
  resources: {}

runner:
  enabled: false
  # true runs the runner as <release>-runner, a Deployment of its own, in place of a sidecar of the
  # controller pod: a controller deploy or a runner roll then costs each machine one redial. Needs egress.enabled.
  separate: false
  replicas: 2
  agentsPort: 7701
  # separate only: where the controller dials a runner pod for links and port forwards.
  linksPort: 7702
  extraArgs: []
  resources: {}

# moor-gate: signs people in with authgear.issuer/clientId tokens and relays /front to the controller.
gate:
  enabled: true
  port: 8443
  # Browser sign-in at /auth: register https://<host>/auth/callback on the Authgear client first.
  login: false
  # Seals the sign-in cookies; every gate replica must hold the same one. Empty makes one on the
  # first install and keeps it across upgrades. Comma-separated, the first seals and all open, so
  # a new key goes in front of the old one for a rollover.
  cookieKey: ""
  # Empty finds the keys through the issuer's discovery document.
  jwksUrl: ""
  # Run the gate as its own Deployment, which dials the controller's ledger over TLS with a front
  # hello and needs no volume, so a controller roll leaves it up. A request waits up to 30 s for
  # the controller, then gets 503. Needs egress.enabled. Off, the gate sits beside the controller.
  separate: false
  # separate only.
  replicas: 2
  # separate only: how long a stopping gate lets requests finish; must outlast the 30 s hold.
  drainSecs: 60
  # separate only, Secret, optional: the certificate the gate presents, for your own ledger CA
  # without its key. Empty makes one from the ledger CA.
  clientCert: ""
  clientKey: ""
  service:
    type: ClusterIP
    nodePort: null
  # /front is a WebSocket held open for a whole session: the ingress must allow long-lived
  # upgrades (raise its read/idle timeouts to hours) or sessions drop when it times them out.
  ingress:
    enabled: false
    className: ""
    annotations: {}
  resources: {}

# /mcp for agents acting as a person; resourceUrl is the API resource the issuer mints tokens for.
mcp:
  enabled: true
  resourceUrl: ""

# The shared egress Proxy, `moor proxy serve-egress`, in a Deployment of its own: every Box's
# credential hosts go through it at wss://<host>/egress, so a controller deploy leaves Box egress up.
# Off, the controller runs the Proxy inside its own pod and each deploy cuts it.
egress:
  enabled: false
  replicas: 2
  port: 8080
  # The address Boxes dial; empty is wss://<host>/egress, through the gate ingress.
  url: ""
  # How long open tunnels get to finish after SIGTERM (serve-egress --grace).
  graceSecs: 300
  # The controller serves its ledger on this port, over TLS, to the egress pods.
  ledgerPort: 7443
  # Secret, optional: the key Box tokens are signed with, MOOR_EGRESS_KEY. Empty makes one on
  # first install and keeps it in the Secret <release>-egress.
  key: ""
  # Secret, optional: the PEM certificate and key the controller's ledger presents, issued for
  # <release>-ledger.<namespace>.svc, and the CA that signed them, all three or none. With them,
  # set either the CA's key, from which the chart signs the client certificates, or both client
  # certificates and keys (egress pods, machine runner), signed by the same CA. Empty makes the
  # CA and every certificate on first install, like key.
  ledgerTls:
    cert: ""
    key: ""
    ca: ""
    caKey: ""
    egressClientCert: ""
    egressClientKey: ""
    runnerClientCert: ""
    runnerClientKey: ""
  resources: {}

persistence:
  size: 10Gi
  storageClassName: ""

podAnnotations: {}
