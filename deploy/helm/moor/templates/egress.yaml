{{- if .Values.egress.enabled }}
{{- $uid := int .Values.controller.uid -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-egress
  labels: {{- include "moor.egressLabels" . | nindent 4 }}
type: Opaque
stringData:
  egress-key: {{ required "egress.key is required when egress.enabled" .Values.egress.key | quote }}
  ledger-ca.pem: {{ required "egress.ledgerTls.ca is required when egress.enabled" .Values.egress.ledgerTls.ca | quote }}
  {{- if .Values.runner.enabled }}
  machine-service-key: {{ include "moor.machineServiceKey" . | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-egress
  labels: {{- include "moor.egressLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.egress.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {{- include "moor.egressLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "moor.egressLabels" . | nindent 8 }}
      annotations:
        checksum/egress: {{ list .Values.egress.key .Values.egress.ledgerTls.ca | toJson | sha256sum | quote }}
        {{- range $k, $v := .Values.podAnnotations }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
    spec:
      hostUsers: false
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {{- include "moor.egressLabels" . | nindent 20 }}
      # Open tunnels get the whole --grace to finish before Kubernetes kills the pod.
      terminationGracePeriodSeconds: {{ add .Values.egress.graceSecs 30 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $uid }}
        runAsGroup: {{ $uid }}
        fsGroup: {{ $uid }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: egress
          image: {{ include "moor.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "moor.gateSecurity" . | nindent 12 }}
          command: [moor, proxy, serve-egress]
          args:
            - --state-dir
            - /var/lib/moor/egress-state
            - --listen
            - 0.0.0.0:{{ .Values.egress.port }}
            - --ledger
            - tls://{{ include "moor.ledgerHost" . }}:{{ .Values.egress.ledgerPort }}
            - --ledger-ca
            - /var/lib/moor/egress/ledger-ca.pem
            - --grace
            - {{ .Values.egress.graceSecs | quote }}
            - --warm-every
            - "10"
            {{- if .Values.runner.enabled }}
            - --machine-service
            - machine.moor.internal={{ .Release.Name }}-machine.{{ .Release.Namespace }}.svc:7700
            {{- end }}
          env:
            - name: MOOR_EGRESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-egress, key: egress-key }
            {{- if .Values.runner.enabled }}
            - name: MOOR_MACHINE_SERVICE_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-egress, key: machine-service-key }
            {{- end }}
          ports:
            - { name: egress, containerPort: {{ .Values.egress.port }} }
          # The Proxy stops accepting at SIGTERM; until the Service and ingress drop the pod,
          # new tunnels would still reach it and be refused.
          lifecycle:
            preStop:
              exec:
                command: [sleep, "10"]
          # Ready only once it has learned the open Boxes from the ledger, so a rollout during a
          # controller deploy waits and the old pods keep serving.
          readinessProbe:
            httpGet: { path: /synced, port: egress }
            periodSeconds: 5
          {{- with .Values.egress.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          # Only the CA and the key: never the database URL, the vault key or provider keys.
          volumeMounts:
            - { name: egress-secrets, mountPath: /var/lib/moor/egress, readOnly: true }
            - { name: egress-state, mountPath: /var/lib/moor/egress-state }
      volumes:
        - name: egress-secrets
          secret:
            secretName: {{ .Release.Name }}-egress
            defaultMode: 0440
            items:
              - { key: ledger-ca.pem, path: ledger-ca.pem }
        - name: egress-state
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-egress
  labels: {{- include "moor.egressLabels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- include "moor.egressLabels" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-egress
  labels: {{- include "moor.egressLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "moor.egressLabels" . | nindent 4 }}
  ports:
    - { name: egress, port: {{ .Values.egress.port }}, targetPort: egress }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ledger
  labels: {{- include "moor.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "moor.labels" . | nindent 4 }}
  ports:
    - { name: ledger, port: {{ .Values.egress.ledgerPort }}, targetPort: ledger }
{{- if .Values.runner.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-machine
  labels: {{- include "moor.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "moor.labels" . | nindent 4 }}
  ports:
    - { name: machine, port: 7700, targetPort: machine }
{{- end }}
---
# Only the egress pods reach the ledger and the machine service, which trusts the X-Moor-* headers
# the Proxy sets. The other controller pod ports stay open to anything that reached them before.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-ledger
  labels: {{- include "moor.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "moor.labels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "moor.egressLabels" . | nindent 14 }}
      ports:
        - { port: ledger, protocol: TCP }
        {{- if .Values.runner.enabled }}
        - { port: machine, protocol: TCP }
        {{- end }}
    {{- if or .Values.gate.enabled .Values.runner.enabled }}
    - ports:
        {{- if .Values.gate.enabled }}
        - { port: gate, protocol: TCP }
        {{- end }}
        {{- if .Values.runner.enabled }}
        - { port: agents, protocol: TCP }
        {{- end }}
    {{- end }}
{{- end }}
