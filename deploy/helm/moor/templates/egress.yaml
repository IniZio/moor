{{- if .Values.egress.enabled }}
{{- $uid := int .Values.controller.uid -}}
{{- $kept := (lookup "v1" "Secret" .Release.Namespace (printf "%s-egress" .Release.Name)).data | default dict -}}
{{- $was := dict -}}
{{- range $k, $v := $kept }}{{ $_ := set $was $k (b64dec $v) }}{{ end -}}
{{- $key := .Values.egress.key | default (get $was "egress-key") | default (randAlphaNum 64) -}}
{{- $tls := .Values.egress.ledgerTls | default dict -}}
{{- $names := list "ledger-ca.pem" "ledger-ca.key" "ledger-tls.crt" "ledger-tls.key" "egress-client.crt" "egress-client.key" "runner-client.crt" "runner-client.key" -}}
{{- $pem := dict -}}
{{- if or $tls.cert $tls.key $tls.ca $tls.caKey $tls.egressClientCert $tls.egressClientKey $tls.runnerClientCert $tls.runnerClientKey -}}
{{- if not (and $tls.cert $tls.key $tls.ca) -}}
{{- fail "egress.ledgerTls needs cert, key and ca together" -}}
{{- end -}}
{{- if not (or $tls.caKey (and $tls.egressClientCert $tls.egressClientKey $tls.runnerClientCert $tls.runnerClientKey)) -}}
{{- fail "egress.ledgerTls with your own ca needs caKey, or all of egressClientCert, egressClientKey, runnerClientCert and runnerClientKey" -}}
{{- end -}}
{{- $pem = dict "ledger-ca.pem" $tls.ca "ledger-ca.key" $tls.caKey "ledger-tls.crt" $tls.cert "ledger-tls.key" $tls.key "egress-client.crt" $tls.egressClientCert "egress-client.key" $tls.egressClientKey "runner-client.crt" $tls.runnerClientCert "runner-client.key" $tls.runnerClientKey -}}
{{- else if and (get $was "ledger-ca.pem") (get $was "ledger-ca.key") -}}
{{- range $names }}{{ $_ := set $pem . (get $was .) }}{{ end -}}
{{- else -}}
{{- $made := genCA "moor ledger CA" 3650 -}}
{{- $pem = dict "ledger-ca.pem" $made.Cert "ledger-ca.key" $made.Key -}}
{{- end -}}
{{- $ca := dict -}}
{{- if get $pem "ledger-ca.key" -}}
{{- $ca = buildCustomCert (get $pem "ledger-ca.pem" | b64enc) (get $pem "ledger-ca.key" | b64enc) -}}
{{- end -}}
{{- if not (and (get $pem "ledger-tls.crt") (get $pem "ledger-tls.key")) -}}
{{- $cert := genSignedCert (include "moor.ledgerHost" .) nil (list (include "moor.ledgerHost" .)) 3650 $ca -}}
{{- $_ := set $pem "ledger-tls.crt" $cert.Cert -}}
{{- $_ := set $pem "ledger-tls.key" $cert.Key -}}
{{- end -}}
{{- range $role := list "egress" "runner" -}}
{{- if not (and (get $pem (printf "%s-client.crt" $role)) (get $pem (printf "%s-client.key" $role))) -}}
{{- $cert := genSignedCert (printf "moor %s" $role) nil nil 3650 $ca -}}
{{- $_ := set $pem (printf "%s-client.crt" $role) $cert.Cert -}}
{{- $_ := set $pem (printf "%s-client.key" $role) $cert.Key -}}
{{- end -}}
{{- end -}}
# The key Box tokens are signed with, the ledger CA with its key, and the certificates it signed.
# Made on first install and read back on each upgrade by the same $names, so they never change by
# accident; kept past an uninstall, since running Boxes hold tokens signed with the key.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-egress
  labels: {{- include "moor.egressLabels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  egress-key: {{ $key | quote }}
  {{- range $names }}
  {{ . }}: {{ get $pem . | default "" | quote }}
  {{- end }}
  machine-service-key: {{ printf "moor machine service:%s" $key | sha256sum | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-egress
  labels: {{- include "moor.egressLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.egress.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {{- include "moor.egressLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "moor.egressLabels" . | nindent 8 }}
      annotations:
        checksum/egress: {{ list .Values.egress.key .Values.egress.ledgerTls.ca .Values.egress.ledgerTls.egressClientCert | toJson | sha256sum | quote }}
        {{- range $k, $v := .Values.podAnnotations }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
    spec:
      hostUsers: false
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {{- include "moor.egressLabels" . | nindent 20 }}
      # Open tunnels get the whole --grace to finish before Kubernetes kills the pod.
      terminationGracePeriodSeconds: {{ add .Values.egress.graceSecs 30 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $uid }}
        runAsGroup: {{ $uid }}
        fsGroup: {{ $uid }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: egress
          image: {{ include "moor.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "moor.gateSecurity" . | nindent 12 }}
          command: [moor, proxy, serve-egress]
          args:
            - --state-dir
            - /var/lib/moor/egress-state
            - --listen
            - 0.0.0.0:{{ .Values.egress.port }}
            - --ledger
            - tls://{{ include "moor.ledgerHost" . }}:{{ .Values.egress.ledgerPort }}
            - --ledger-ca
            - /var/lib/moor/egress/ledger-ca.pem
            - --ledger-cert
            - /var/lib/moor/egress/egress-client.crt
            - --ledger-key
            - /var/lib/moor/egress/egress-client.key
            - --grace
            - {{ .Values.egress.graceSecs | quote }}
            - --warm-every
            - "10"
            {{- if .Values.runner.enabled }}
            - --machine-service
            - machine.moor.internal={{ .Release.Name }}-machine.{{ .Release.Namespace }}.svc:7700
            {{- end }}
          env:
            - name: MOOR_EGRESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-egress, key: egress-key }
            {{- if .Values.runner.enabled }}
            - name: MOOR_MACHINE_SERVICE_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-egress, key: machine-service-key }
            {{- end }}
          ports:
            - { name: egress, containerPort: {{ .Values.egress.port }} }
          # The Proxy stops accepting at SIGTERM; until the Service and ingress drop the pod,
          # new tunnels would still reach it and be refused.
          lifecycle:
            preStop:
              exec:
                command: [sleep, "10"]
          # Ready only once it has learned the open Boxes from the ledger, so a rollout during a
          # controller deploy waits and the old pods keep serving.
          readinessProbe:
            httpGet: { path: /synced, port: egress }
            periodSeconds: 5
          {{- with .Values.egress.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          # Only the CA, the client certificate and the key: never the database URL, the vault key
          # or provider keys.
          volumeMounts:
            - { name: egress-secrets, mountPath: /var/lib/moor/egress, readOnly: true }
            - { name: egress-state, mountPath: /var/lib/moor/egress-state }
      volumes:
        - name: egress-secrets
          secret:
            secretName: {{ .Release.Name }}-egress
            defaultMode: 0440
            items:
              - { key: ledger-ca.pem, path: ledger-ca.pem }
              - { key: egress-client.crt, path: egress-client.crt }
              - { key: egress-client.key, path: egress-client.key }
        - name: egress-state
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-egress
  labels: {{- include "moor.egressLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "moor.egressLabels" . | nindent 4 }}
  ports:
    - { name: egress, port: {{ .Values.egress.port }}, targetPort: egress }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ledger
  labels: {{- include "moor.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "moor.labels" . | nindent 4 }}
  ports:
    - { name: ledger, port: {{ .Values.egress.ledgerPort }}, targetPort: ledger }
{{- if .Values.runner.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-machine
  labels: {{- include "moor.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "moor.labels" . | nindent 4 }}
  ports:
    - { name: machine, port: 7700, targetPort: machine }
{{- end }}
{{- end }}
