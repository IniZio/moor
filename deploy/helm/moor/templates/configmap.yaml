apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels: {{- include "moor.labels" . | nindent 4 }}
data:
  controller.yaml: |
    state_dir: /var/lib/moor/pv/state
    settle_every_secs: {{ .Values.controller.settleEverySecs }}
    drain_timeout_secs: {{ .Values.controller.drainTimeoutSecs }}
    {{- if or .Values.slack.enabled .Values.gate.enabled .Values.notify.enabled }}
    fronts:
      {{- if .Values.slack.enabled }}
      slack:
        proxy_rules: [claude]
        {{- if include "moor.slackSeparate" . }}
        remote:
          key_file: /var/lib/moor/config/slack-front.key
        {{- end }}
      {{- end }}
      {{- if include "moor.gateSeparate" . }}
      authgear:
        remote:
          key_file: /var/lib/moor/config/gate-front-key
      {{- else if .Values.gate.enabled }}
      authgear: {}
      {{- end }}
      {{- if .Values.notify.enabled }}
      notify:
        webhooks: true
      {{- end }}
    {{- else }}
    fronts: {}
    {{- end }}
    {{- if .Values.egress.enabled }}
    ledger_tls:
      listen: 0.0.0.0:{{ .Values.egress.ledgerPort }}
      cert: /var/lib/moor/config/ledger-tls.crt
      key: /var/lib/moor/config/ledger-tls.key
      client_ca: /var/lib/moor/config/ledger-ca.pem
    {{- end }}
  {{- if .Values.slack.enabled }}
  slack.yaml: |
    app_token_file: /var/lib/moor/slack/app-token
    bot_token_file: /var/lib/moor/slack/bot-token
  {{- end }}
  {{- if include "moor.slackSeparate" . }}
  slack-forward.json: |
    {"listen":"127.0.0.1:{{ .Values.slack.proxyPort }}","upstream":{{ include "moor.egressUrl" . | quote }}}
  {{- end }}
  config.yaml: |
    {{- with .Values.controller.nodes }}
    nodes: {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.controller.defaultNode }}
    box:
      node: {{ . }}
    {{- end }}
    {{- with .Values.controller.surface }}
    surface:
      kind: {{ . }}
    {{- end }}
    {{- with .Values.controller.agentModel }}
    agent:
      model: {{ . | quote }}
    {{- end }}
    {{- if .Values.runner.enabled }}
    machines:
      service:
        host: machine.moor.internal
        upstream: 127.0.0.1:7700
    {{- end }}
    {{- with .Values.controller.drivers }}
    drivers: {{- toYaml . | nindent 6 }}
    {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-public
  labels: {{- include "moor.labels" . | nindent 4 }}
data:
  host: {{ required "host is required" .Values.host | quote }}
  authgear.issuer: {{ required "authgear.issuer is required" .Values.authgear.issuer | quote }}
  authgear.clientId: {{ required "authgear.clientId is required" .Values.authgear.clientId | quote }}
  mcp.resourceUrl: {{ required "mcp.resourceUrl is required" .Values.mcp.resourceUrl | quote }}
