{{- with .Values.publicIngress }}
{{- if .enabled }}
{{- $class := required "publicIngress.className is required" .className }}
{{- $host := required "publicIngress.host is required" .host }}
{{- $egress := $.Values.egress.enabled }}
{{- $hook := $.Values.githubApp.webhookSecret }}
{{- if or $egress $hook }}
# Only the paths a caller outside the private network needs. The gate host stays private.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Release.Name }}-public
  labels: {{- include "moor.labels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $class | quote }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- if $egress }}
          - path: /egress
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-egress
                port: { name: egress }
          {{- end }}
          {{- if $hook }}
          - path: /hooks/github
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-gate
                port: { name: gate }
          {{- end }}
{{- end }}
{{- end }}
{{- end }}
