{{- with .Values.publicIngress }}
{{- if .enabled }}
{{- $class := required "publicIngress.className is required" .className }}
{{- $host := required "publicIngress.host is required" .host }}
{{- if $.Values.githubApp.webhookSecret }}
# Only the GitHub App webhook, the one caller outside the private network. The gate host stays private.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Release.Name }}-public
  labels: {{- include "moor.labels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $class | quote }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /hooks/github
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-gate
                port: { name: gate }
{{- end }}
{{- end }}
{{- end }}
