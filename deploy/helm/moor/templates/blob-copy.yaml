{{- if and (include "moor.stateless" .) .Values.blobs.copyFromVolume }}
{{- $s3 := .Values.blobs.s3 }}
{{- $uid := int .Values.controller.uid }}
apiVersion: batch/v1
kind: Job
metadata:
  # A Job's pod spec cannot change, so a new bucket gets a new Job.
  name: {{ .Release.Name }}-blob-copy-{{ printf "%s/%s" $s3.endpoint $s3.bucket | sha256sum | trunc 8 }}
  labels: {{- include "moor.labels" . | nindent 4 }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moor-blob-copy
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $uid }}
        runAsGroup: {{ $uid }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copy
          image: docker.io/rclone/rclone:1.69.1@sha256:600f51856285df1ae5d91c8bb2682cbbe31bf109ebeeef9ecead6ca8c0ff6138
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          command:
            - sh
            - -ec
            - |
              for dir in artifacts reports transcripts; do
                if [ -d "/pv/state/$dir" ]; then
                  rclone copy "/pv/state/$dir" ":s3:$BUCKET/$dir" --ignore-existing --exclude '.*' --exclude '.*/**' --stats-one-line -v
                fi
              done
          env:
            - { name: HOME, value: /tmp }
            - { name: BUCKET, value: {{ $s3.bucket | quote }} }
            - { name: RCLONE_S3_PROVIDER, value: Other }
            - { name: RCLONE_S3_ENDPOINT, value: {{ $s3.endpoint | quote }} }
            - { name: RCLONE_S3_REGION, value: us-east-1 }
            - { name: RCLONE_S3_FORCE_PATH_STYLE, value: "true" }
            - { name: RCLONE_S3_NO_CHECK_BUCKET, value: "true" }
            - name: RCLONE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-secrets, key: blobs-access-key }
            - name: RCLONE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-secrets, key: blobs-secret-key }
          volumeMounts:
            - { name: state, mountPath: /pv, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: state
          persistentVolumeClaim: { claimName: moor-state, readOnly: true }
        - name: tmp
          emptyDir: {}
{{- end }}
