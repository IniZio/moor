apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels: {{- include "moor.labels" . | nindent 4 }}
type: Opaque
stringData:
  vault.key: {{ required "vault.key is required" .Values.vault.key | quote }}
  {{- with .Values.database.url }}
  database-url: {{ . | quote }}
  {{- end }}
  {{- with .Values.blobs.s3 }}
  blobs-access-key: {{ required "blobs.s3.accessKey is required" .accessKey | quote }}
  blobs-secret-key: {{ required "blobs.s3.secretKey is required" .secretKey | quote }}
  {{- end }}
