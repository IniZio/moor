apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels: {{- include "moor.labels" . | nindent 4 }}
type: Opaque
stringData:
  vault.key: {{ required "vault.key is required" .Values.vault.key | quote }}
  agent37-token: {{ required "crabbox.agent37Token is required" .Values.crabbox.agent37Token | quote }}
  {{- with .Values.database.url }}
  database-url: {{ . | quote }}
  {{- end }}
  {{- with .Values.crabbox.config }}
  {{- $c := dict }}
  {{- if kindIs "string" . }}{{ $c = fromYaml . }}{{ else }}{{ $c = deepCopy . }}{{ end }}
  {{- if $.Values.crabbox.sshKey }}
  {{- $_ := set $c "ssh" (merge (dict "key" "/var/lib/moor/config/box-ssh-key") (get $c "ssh" | default dict)) }}
  {{- end }}
  crabbox.yaml: {{ toYaml $c | quote }}
  {{- end }}
  {{- with .Values.crabbox.sshKey }}
  box-ssh-key: {{ . | quote }}
  {{- end }}
  {{- if .Values.egress.enabled }}
  egress-key: {{ required "egress.key is required when egress.enabled" .Values.egress.key | quote }}
  ledger-tls.crt: {{ required "egress.ledgerTls.cert is required when egress.enabled" .Values.egress.ledgerTls.cert | quote }}
  ledger-tls.key: {{ required "egress.ledgerTls.key is required when egress.enabled" .Values.egress.ledgerTls.key | quote }}
  {{- end }}
  {{- if .Values.slack.enabled }}
  slack-app-token: {{ required "slack.appToken is required when slack.enabled" .Values.slack.appToken | quote }}
  slack-bot-token: {{ required "slack.botToken is required when slack.enabled" .Values.slack.botToken | quote }}
  {{- end }}
