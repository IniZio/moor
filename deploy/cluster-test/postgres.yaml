apiVersion: v1
kind: Pod
metadata:
  name: postgres
  labels: {app: postgres}
spec:
  containers:
    - name: postgres
      image: postgres:17
      args: ["-c", "fsync=off"]
      env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: {name: postgres-auth, key: password}
      readinessProbe:
        exec: {command: ["pg_isready", "-U", "postgres"]}
        periodSeconds: 2
      volumeMounts:
        - {name: data, mountPath: /var/lib/postgresql/data}
  volumes:
    - name: data
      emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
