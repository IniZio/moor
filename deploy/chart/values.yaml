replicaCount: 2

image:
  repository: ghcr.io/example-org/portal
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  name: ""

portal:
  userHeader: ""
  orgName: ""
  publicURL: ""
  trustedOrigins: []
  homeDir: ""
  runnerArgs: ""
  # The Postgres schema for every table, when other software shares the database. Made when missing.
  databaseSchema: ""

# A first settings document, saved as version 1 when none exists. It may hold real secret values.
seed:
  settings: ""

secrets:
  create: false
  values: {}
  existingSecret: ""
  keys:
    databaseURL: database-url
    secretKey: secret-key
    internalSecret: internal-secret

stop:
  waitSeconds: 10
  drainSeconds: 30
terminationGracePeriodSeconds: 60

probes:
  readinessPath: /readyz
  livenessPath: /healthz

service:
  type: ClusterIP
  port: 80
  nodePort: null
  annotations: {}

ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecretName: ""
  hosts: []
  # What reaches the portal from outside the sign-in: the webhook, the runner's join and link, and what the
  # tasks' own proxies and desks call with their per-task tokens. No page and no person's API is here.
  paths:
    - /hooks/github
    - /runner/join
    - /runner/link
    - /internal/policy
    - /internal/credentials
    - /internal/blocked
  patterns:
    - /api/tasks/[^/]+/results
  annotations: {}

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

podAnnotations: {}
extraEnv: []
extraVolumes: []
extraVolumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
