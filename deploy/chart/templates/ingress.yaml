{{- if .Values.ingress.enabled }}
{{- $base := omit .Values.ingress "enabled" "hosts" }}
{{- $entries := .Values.ingress.hosts | default (list (dict)) }}
{{- range $entry := $entries }}
{{- $in := deepCopy $base }}
{{- range $k, $v := $entry }}{{- $_ := set $in $k $v }}{{- end }}
{{- $host := required "ingress.host, or the host of each ingress.hosts entry, is required when ingress.enabled is true" $in.host }}
{{- $name := include "portal.fullname" $ }}
{{- if $.Values.ingress.hosts }}
{{- $name = printf "%s-%s" $name (required "each ingress.hosts entry needs a name" $in.name) }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "portal.labels" $ | nindent 4 }}
  {{- $annotations := $in.annotations | default dict }}
  {{- if $in.patterns }}
  {{- $annotations = merge (dict "nginx.ingress.kubernetes.io/use-regex" "true") $annotations }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $in.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $in.tlsSecretName }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ $in.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range $in.paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "portal.fullname" $ }}
                port:
                  name: http
          {{- end }}
          {{- range $in.patterns }}
          - path: {{ . | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "portal.fullname" $ }}
                port:
                  name: http
          {{- end }}
{{- end }}
{{- end }}
