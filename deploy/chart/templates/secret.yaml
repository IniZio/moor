{{- if .Values.secrets.create }}
{{- $v := .Values.secrets.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "portal.secretName" . }}
  labels:
    {{- include "portal.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.databaseURL }}: {{ required "secrets.values.databaseURL is required with secrets.create" $v.databaseURL | quote }}
  {{ .Values.secrets.keys.secretKey }}: {{ required "secrets.values.secretKey is required with secrets.create" $v.secretKey | quote }}
  {{ .Values.secrets.keys.internalSecret }}: {{ required "secrets.values.internalSecret is required with secrets.create" $v.internalSecret | quote }}
{{- end }}
{{- if .Values.seed.settings }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "portal.fullname" . }}-seed
  labels:
    {{- include "portal.labels" . | nindent 4 }}
type: Opaque
stringData:
  settings.yaml: {{ .Values.seed.settings | quote }}
{{- end }}
