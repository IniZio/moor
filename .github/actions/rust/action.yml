name: Rust toolchain, build cache and pinned tools
description: Install the pinned toolchain and bun (moor-gate's build script runs it), restore the target cache for a job, and install the pinned cargo tools.

inputs:
  cache:
    description: Cache name. Jobs that build the same artifacts share one name so they restore the same target.
    required: true

runs:
  using: composite
  steps:
    - name: Install toolchain from rust-toolchain.toml
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install

    - uses: ./.github/actions/bun

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: ${{ inputs.cache }}
        cache-bin: false
        save-if: ${{ github.event_name == 'push' }}

    - id: tools
      shell: bash
      run: echo "list=$(make -s print-tool-versions)" >> "$GITHUB_OUTPUT"

    - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
      with:
        tool: ${{ steps.tools.outputs.list }}
