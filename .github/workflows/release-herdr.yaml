name: Release moor-herdr

on:
  push:
    tags: ["moor-herdr-v*"]
  pull_request:
    paths:
      - .github/workflows/release-herdr.yaml
      - crates/moor-herdr/herdr/build.sh

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag names the crate's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/moor-herdr/Cargo.toml | head -n 1)
          [ "$GITHUB_REF_NAME" = "moor-herdr-v$version" ] || {
            echo "tag $GITHUB_REF_NAME does not match crates/moor-herdr version $version" >&2
            exit 1
          }
      - run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "moor-herdr for the herdr plugin in crates/moor-herdr/herdr."
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: draft
    if: always() && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - run: cargo build -p moor-herdr --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          asset=moor-herdr-${{ matrix.target }}.tar.gz
          mkdir -p dist
          tar -czf "dist/$asset" -C target/${{ matrix.target }}/release moor-herdr
          (cd dist && shasum -a 256 "$asset" > "$asset.sha256")
      - name: The plugin installs from this build
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          home=$(mktemp -d)
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/moor-herdr/Cargo.toml | head -n 1)
          mkdir -p "$home/rel/moor-herdr-v$version" && cp dist/* "$home/rel/moor-herdr-v$version/"
          HOME=$home XDG_CONFIG_HOME= XDG_STATE_HOME= MOOR_HERDR_RELEASES="file://$home/rel" sh crates/moor-herdr/herdr/build.sh
          "$home/.local/state/herdr/plugins/moor/bin/moor-herdr" --version
          grep -q "default_shell = \"$home/.local/state/herdr/plugins/moor/shell.sh\"" "$home/.config/herdr/plugins/config/moor/herdr-setup.toml"
      - name: Upload
        if: github.event_name == 'push'
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
