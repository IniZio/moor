name: CD

# Every push to main (stable vX.Y.Z) or develop (vX.Y.Z-nightly.N) lets semantic-release decide
# from the commit types whether to release; the builds run only when it made a tag.
on:
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - .github/workflows/cd.yaml
      - .releaserc.json
      - crates/moor-herdr/herdr/build.sh

concurrency:
  group: cd-${{ github.ref }}
  # A cancel mid-publish would leave a release without some of its binaries.
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.semantic.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install semantic-release
        run: |
          npm install --no-save \
            semantic-release@24.2.3 \
            @semantic-release/commit-analyzer@13.0.1 \
            @semantic-release/release-notes-generator@14.1.3 \
            @semantic-release/github@11.0.6 \
            conventional-changelog-conventionalcommits@8.0.0
      - id: semantic
        name: Release if the commits call for one
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before=$(git tag -l 'v*' | sort)
          ./node_modules/.bin/semantic-release
          git fetch -q --tags --force origin
          tag=$(comm -13 <(echo "$before") <(git tag -l 'v*' | sort) | tail -n 1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "${tag:-no release this run}"

  build:
    needs: release
    if: always() && (needs.release.outputs.tag != '' || github.event_name == 'pull_request')
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release.outputs.tag || 'v0.0.0-check' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag || github.sha }}
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Install a musl C compiler
        if: endsWith(matrix.target, '-linux-musl')
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q musl-tools
          target=${{ matrix.target }}
          echo "CC_${target//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - run: MOOR_VERSION=${TAG#v} cargo build -p moor-herdr --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          asset=moor-herdr-${{ matrix.target }}.tar.gz
          mkdir -p dist
          tar -czf "dist/$asset" -C target/${{ matrix.target }}/release moor-herdr
          (cd dist && shasum -a 256 "$asset" > "$asset.sha256")
      - name: The plugin installs from this build
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          home=$(mktemp -d)
          mkdir -p "$home/rel/$TAG" && cp dist/* "$home/rel/$TAG/"
          HOME=$home XDG_CONFIG_HOME='' XDG_STATE_HOME='' MOOR_HERDR_TAG=$TAG MOOR_HERDR_RELEASES="file://$home/rel" \
            sh crates/moor-herdr/herdr/build.sh
          "$home/.local/state/herdr/plugins/moor/bin/moor-herdr" --version | grep -qx "moor-herdr ${TAG#v}"
          grep -q "default_shell = \"$home/.local/state/herdr/plugins/moor/shell.sh\"" "$home/.config/herdr/plugins/config/moor/herdr-setup.toml"
      - name: Upload
        if: github.event_name == 'push'
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  image:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - id: version
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Every release names its own tag; there is no moving one.
          tags: ghcr.io/inizio/moor:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: MOOR_COMMIT=${{ steps.version.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gitops:
    needs: [release, image]
    # The release environment keeps the deploy key away from pull requests.
    if: github.event_name == 'push' && needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - name: Record the release in the deploy repository
        env:
          TAG: ${{ needs.release.outputs.tag }}
          GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
          GITOPS_REPO: ${{ vars.GITOPS_REPO }}
        run: .github/scripts/gitops-bump.sh
