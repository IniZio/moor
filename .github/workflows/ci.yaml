name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: moor
          POSTGRES_PASSWORD: moor
          POSTGRES_DB: moor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moor" --health-interval 2s --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
            cargo-target-${{ runner.os }}-

      - id: tools
        run: echo "list=$(make -s print-tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: ${{ steps.tools.outputs.list }}

      - id: helm
        run: echo "version=$(make -s print-helm)" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v${{ steps.helm.outputs.version }}

      - run: make setup
      - name: Fetch the base branch for the migration-number check
        env:
          BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" fetch --no-tags --depth=1 origin \
            "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
      - run: make lint
        env:
          BASE: origin/${{ github.base_ref || github.ref_name }}
      - run: make chart
      - run: make audit
      - name: Allow unprivileged user namespaces for the front tests
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: sudo apt-get install -y tmux
      - name: Install the herdr-core moor pins
        run: |
          curl -fsSL https://releases.herdr.dev/core/0.1.16/herdr-core-linux-x86_64.tar.gz -o "$RUNNER_TEMP/hc.tar.gz"
          echo "58d6861176dc6fe905b58880d5bff07a9959be613a98e5d66b4583b04b6cfa45  $RUNNER_TEMP/hc.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/hc.tar.gz" -C /usr/local/bin herdr-core
      - run: make unit
      - name: Check the store schema on Postgres matches SQLite
        run: make unit-pg
      - name: Run the egress proxy under parallel load through a real tinyproxy
        run: |
          sudo apt-get install -y tinyproxy-bin
          cargo test -p moor-core --locked --lib -- --ignored exec_env::tests::egress_load

  pty-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: cargo-target-pty-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-target-pty-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
            cargo-target-pty-${{ runner.os }}-

      - name: Install Zig, pinned by version and checksum, for libghostty-vt
        run: |
          read -r version sha < <(make -s print-zig)
          curl -fsSLo "$RUNNER_TEMP/zig.tar.xz" "https://ziglang.org/download/$version/zig-x86_64-linux-$version.tar.xz"
          echo "$sha  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "ZIG=$RUNNER_TEMP/zig/zig" >> "$GITHUB_ENV"

      - run: make lint-pty
      - run: make unit-pty

  macos-fronts:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
            cargo-target-${{ runner.os }}-${{ runner.arch }}-

      - run: cargo clippy -p moor --all-targets --locked -- -D warnings
      - run: cargo build -p moor-web -p moor-slack --locked
      - run: cargo test -p moor --locked --lib -- front_shim controller::peer
      - run: cargo test -p moor --locked --test cli fronts_macos
      - name: Show what the sandbox refused
        if: always()
        run: >-
          log show --last 20m --style compact --predicate 'eventMessage CONTAINS "deny("'
          | grep -iE 'python|moor|sh\(' | sed -E 's/.*Sandbox: //; s/\([0-9]+\)//; s/front-[A-Za-z0-9]+/front-X/'
          | sort | uniq -c | sort -rn | head -100
