name: CI

on:
  push:
    branches: [fresh]
  pull_request:
    branches: [fresh]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: moor
          POSTGRES_DB: moor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # test-docker builds the multi-GB Box image, which does not fit in this job's time.
      MOOR_SKIP_DOCKER_TESTS: "1"
      MOOR_TEST_POSTGRES_DSN: postgres://postgres:moor@localhost:5432/moor?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - run: make setup
      - run: make ci
