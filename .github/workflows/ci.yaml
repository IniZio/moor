name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.tip.outputs.run }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ] && [ "$HEAD_REPO" = "$REPO" ]; then
            above=$(gh api "repos/$REPO/pulls?state=open&base=$HEAD_REF&per_page=1" --jq length)
            [ "$above" = 0 ] || run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: make --no-print-directory web
      - name: The committed account page matches its source
        run: git diff --exit-code -- crates/moor-gate/web/dist

  lint:
    needs: stack
    if: needs.stack.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust
        with:
          cache: lint

      - id: helm
        run: echo "version=$(make -s print-helm)" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v${{ steps.helm.outputs.version }}

      - run: make setup
      - name: Fetch the base branch for the migration-number check
        env:
          BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" fetch --no-tags --depth=1 origin \
            "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
      - run: make lint
        env:
          BASE: origin/${{ github.base_ref || github.ref_name }}
      - run: make chart
      - run: make audit

  unit:
    needs: stack
    if: needs.stack.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust
        with:
          cache: test

      - name: Allow unprivileged user namespaces for the front tests
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install the herdr-core moor pins
        run: |
          curl -fsSL https://releases.herdr.dev/core/0.1.16/herdr-core-linux-x86_64.tar.gz -o "$RUNNER_TEMP/hc.tar.gz"
          echo "58d6861176dc6fe905b58880d5bff07a9959be613a98e5d66b4583b04b6cfa45  $RUNNER_TEMP/hc.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/hc.tar.gz" -C /usr/local/bin herdr-core
      - run: make unit-nextest PARTITION=count:${{ matrix.shard }}/3

  integration:
    needs: stack
    if: needs.stack.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: moor
          POSTGRES_PASSWORD: moor
          POSTGRES_DB: moor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moor" --health-interval 2s --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust
        with:
          cache: test

      - name: Allow unprivileged user namespaces for the front tests
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the doc tests
        run: make unit-doc
      - name: Check the store schema and run the store tests on Postgres
        run: make unit-pg
      - name: Round-trip blobs through a real S3-compatible store
        run: |
          make dev-s3
          make unit-s3
      - name: Run the egress proxy under parallel load through a real tinyproxy
        run: |
          sudo apt-get install -y tinyproxy-bin
          make unit-egress

  test:
    needs: [stack, web, lint, unit, integration]
    if: always() && needs.stack.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a test job finished $r"; exit 1; }
          done

  macos-fronts:
    needs: stack
    if: needs.stack.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
            cargo-target-${{ runner.os }}-${{ runner.arch }}-

      - run: cargo clippy -p moor --all-targets --locked -- -D warnings
      - run: cargo build -p moor-slack --locked
      - run: cargo test -p moor --locked --lib -- front_shim controller::peer
      - run: cargo test -p moor --locked --test cli fronts_macos
      - name: Show what the sandbox refused
        if: always()
        run: >-
          log show --last 20m --style compact --predicate 'eventMessage CONTAINS "deny("'
          | grep -iE 'python|moor|sh\(' | sed -E 's/.*Sandbox: //; s/\([0-9]+\)//; s/front-[A-Za-z0-9]+/front-X/'
          | sort | uniq -c | sort -rn | head -100
