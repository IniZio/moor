name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
            cargo-target-${{ runner.os }}-

      - id: tools
        run: echo "list=$(make -s print-tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: ${{ steps.tools.outputs.list }}

      - run: make setup
      - run: make lint
      - run: make audit
      - name: Allow unprivileged user namespaces for the front tests
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: make unit
      - name: Run the egress proxy under parallel load through a real tinyproxy
        run: |
          sudo apt-get install -y tinyproxy-bin
          cargo test -p moor-core --locked --lib -- --ignored exec_env::tests::egress_load

  macos-fronts:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
            cargo-target-${{ runner.os }}-${{ runner.arch }}-

      - run: cargo clippy -p moor --all-targets --locked -- -D warnings
      - run: cargo build -p moor-web -p moor-slack --locked
      - run: cargo test -p moor --locked --lib -- front_shim controller::peer
      - run: cargo test -p moor --locked --test cli fronts_macos
      - name: Show what the sandbox refused
        if: always()
        run: >-
          log show --last 20m --style compact --predicate 'eventMessage CONTAINS "deny("'
          | grep -iE 'python|moor|sh\(' | sed -E 's/.*Sandbox: //; s/\([0-9]+\)//; s/front-[A-Za-z0-9]+/front-X/'
          | sort | uniq -c | sort -rn | head -100
